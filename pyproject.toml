[project]
name = "duebook"
version = "0.1.0"
description = "MCP server that owns a household's hard deadlines as a markdown vault."
license = "MIT"
authors = [
    { name = "srp10", email = "83276896+srp10@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
duebook = "duebook.server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
